{% extends "store/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
<form method="post">
  {% csrf_token %}{{ form.as_p }}
  <button class="btn" type="submit">Log in</button>
</form>
<p><a href="{% url 'password_reset_request' %}">Forgot your password?</a> &middot; <a href="{% url 'register' %}">Create an account</a></p>
{% endblock %}
