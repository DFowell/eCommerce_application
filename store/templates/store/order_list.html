{% extends "store/base.html" %}
{% block title %}My orders{% endblock %}
{% block content %}
<h1>My orders</h1>
<table>
  <tr><th>Order</th><th>Date</th><th>Total</th></tr>
  {% for o in orders %}
    <tr><td><a href="{% url 'order_detail' o.pk %}">#{{ o.pk }}</a></td><td>{{ o.created_at|date:"d M Y H:i" }}</td><td>£{{ o.total }}</td></tr>
  {% empty %}
    <tr><td colspan="3">No orders yet.</td></tr>
  {% endfor %}
</table>
{% endblock %}
